
name: Build CIA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y unzip wget git cmake g++ make python3

      - name: Install 3DS libraries
        run: |
          if [ -d /opt/devkitpro/libctru ] && [ -x /opt/devkitpro/tools/bin/smdhtool ]; then
            echo "3DS development tools already installed"
            exit 0
          fi

          for i in 1 2 3 4 5 6; do
            echo "Attempt $i"
            if dkp-pacman -Syu --noconfirm 3ds-dev; then
              exit 0
            fi
            sleep $((i * 15))
          done

          echo "ERROR: Could not install 3ds-dev"
          exit 1

      - name: Install makerom
        run: |
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O makerom.zip
          mkdir -p mr
          unzip -o makerom.zip -d mr
          cp "$(find mr -type f -name 'makerom*' ! -name '*.zip' | head -n 1)" /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          makerom -version || true

      - name: Install bannertool
        run: |
          git clone --recursive https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          mkdir build
          cd build
          cmake ..
          make -j"$(nproc)"
          cp "$(find . -type f -name bannertool | head -n 1)" /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool

      - name: Unpack NES project
        run: |
          ZIP="$(find . -type f -name 'nes3ds.zip' -not -path './.git/*' | head -n 1)"

          mkdir -p build_dir

          if [ -n "$ZIP" ]; then
            echo "Found NES project: $ZIP"
            unzip -o "$ZIP" -d build_dir
          else
            echo "NES ZIP not found, using repository files"
            cp -r ./* build_dir/ 2>/dev/null || true
          fi

          echo "Project files:"
          find build_dir -maxdepth 3 -not -path '*/.git/*'

      - name: Verify NES project
        run: |
          MK="$(find build_dir -name Makefile | head -n 1)"

          if [ -z "$MK" ]; then
            echo "ERROR: NES Makefile not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$MK")"

          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/cia.rsf" ]; then
            echo "ERROR: NES cia.rsf not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/banner.png" ]; then
            echo "ERROR: banner.png not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/icon.png" ]; then
            echo "ERROR: icon.png not found"
            exit 1
          fi

          echo "NES project files verified"

      - name: Build NES Emulator CIA
        shell: bash
        run: |
          MK="$(find build_dir -name Makefile | head -n 1)"

          [ -n "$MK" ] || {
            echo "ERROR: No Makefile found"
            exit 1
          }

          cd "$(dirname "$MK")"

          echo "Building NES Emulator"
          echo "DEVKITARM=$DEVKITARM"

          set +e
          make cia 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "========== BUILD ERROR SUMMARY =========="

          grep -nE "error:|undefined reference|No such file|\*\*\*|Error [0-9]|cannot find|fatal" \
            "$GITHUB_WORKSPACE/build.log" | tail -30 || true

          echo "========================================="

          exit $STATUS

      - name: Collect CIA output
        run: |
          mkdir -p out

          find build_dir -type f \( \
            -name '*.cia' -o \
            -name '*.3dsx' \
          \) -exec cp {} out/ \;

          echo "Build outputs:"
          ls -lh out

          if ! ls out/*.cia >/dev/null 2>&1; then
            echo "ERROR: CIA file was not generated"
            exit 1
          fi

      - name: Upload CIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NES-Emulator-CIA
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NES Emulator - Latest Build
          make_latest: true
          files: out/*
          fail_on_unmatched_files: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NES-build-log
          path: build.log
          if-no-files-found: ignore
